name: PR Validation

on:
  pull_request:

jobs:
  build-package:
    name: Create PyPI Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use Python 3.8
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.8

      - name: Pip cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-build-vsix-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-build-vsix-

      - name: Install nox
        run: python -m pip install nox
        shell: bash

      - name: Build pypi package
        run: python -m nox --session build_python_package
        shell: bash

      - name: Upload Python Packages to Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pypi-packages
          path: |
            packages/python/dist/*.gz
            packages/python/dist/*.whl
          if-no-files-found: error
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Pip cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-

      - name: Install nox
        run: python -m pip install nox
        shell: bash

      - name: Check linting and formatting
        run: python -m nox --session lint
        shell: bash

      - name: Rust Tool Chain setup
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: rustfmt

      - name: Rustfmt Check
        uses: actions-rust-lang/rustfmt@4066006ec54a31931b9b1fddfd38f2fdf2d27143 # v1.1.2
        with:
          manifest-path: packages/rust/lsprotocol/Cargo.toml

      - name: Dotnet Tool Chain setup
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '6.0.x'

      - name: Dotnet Format Check
        run: dotnet format packages/dotnet/lsprotocol/lsprotocol.csproj --verify-no-changes
        shell: bash

  python-tests:
    name: Python Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13-dev']

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use Python ${{ matrix.python }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - name: Update pip, install wheel and nox
        run: python -m pip install -U pip wheel nox
        shell: bash

      - name: Run tests
        run: python -m nox --session tests
        shell: bash

  python-coverage:
    name: Python Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use Python 3.x
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Update pip, install wheel and nox
        run: python -m pip install -U pip wheel nox
        shell: bash

      - name: Run coverage
        run: python -m nox --session coverage
        shell: bash

  rust-tests:
    name: 'Rust Tests'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Rust Tool Chain setup
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable

      - name: Install Generator
        run: python -m pip install -r ./requirements.txt

      - name: Generate Test Data
        run: python -m generator --plugin testdata

      - name: Rust Run Tests
        run: cargo test --manifest-path tests/rust/Cargo.toml
        shell: bash
        env:
          LSP_TEST_DATA_PATH: ${{ github.workspace }}/packages/testdata

  dotnet-tests:
    name: Dotnet Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Dotnet Tool Chain setup
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '6.0.x'

      - name: Install Generator
        run: python -m pip install -r ./requirements.txt

      - name: Generate Test Data
        run: python -m generator --plugin testdata

      - name: Generate C# Code
        run: python -m generator --plugin dotnet

      - name: Dotnet Build Tests
        run: dotnet build tests/dotnet/lsprotocol_tests/lsprotocol_tests.csproj
        shell: bash

      - name: Dotnet Run Tests
        run: dotnet test tests/dotnet/lsprotocol_tests/lsprotocol_tests.csproj
        shell: bash
        env:
          LSP_TEST_DATA_PATH: ${{ github.workspace }}/packages/testdata

  dotnet-project:
    name: Dotnet Project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Install Generator
        run: python -m pip install -r ./requirements.txt

      - name: Generate C# Code
        run: python -m generator --plugin dotnet

      - name: Format generated code
        run: dotnet format packages/dotnet/lsprotocol/lsprotocol.csproj
        shell: bash

      - name: Upload Dotnet Project to Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dotnet-project
          path: |
            packages/dotnet/lsprotocol/*.csproj
            packages/dotnet/lsprotocol/*.cs
          if-no-files-found: error
          retention-days: 7

